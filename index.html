<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="お金メモ"/>
  <title>お金メモ</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --border: #1e1e1e;
      --text: #f0ede8;
      --muted: #444;
      --dim: #222;
      --red: #ef4444;
      --green: #22c55e;
      --gold: #f59e0b;
      --purple: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.4;
    }

    #app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 40px;
      padding-top: env(safe-area-inset-top, 0px);
    }

    /* ── Header ── */
    .header {
      padding: 32px 24px 20px;
      border-bottom: 1px solid var(--border);
    }
    .header-eyebrow {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .header-title {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 20px;
    }

    /* net balance big display */
    .net-balance {
      margin-bottom: 16px;
    }
    .net-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .net-value {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
    }

    /* top two mini cards */
    .mini-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mini-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      animation: fadeUp .4s ease both;
    }
    .mini-card-label { font-size: 9px; letter-spacing: 2px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
    .mini-card-value { font-size: 18px; font-weight: 500; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .tab {
      flex: 1; padding: 14px 0;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
      font-family: inherit;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .15s;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--text); }

    /* ── Sections ── */
    .section { padding: 24px; }

    /* account cards */
    .account-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 10px;
      animation: fadeUp .4s ease both;
    }
    .account-card.savings-card {
      border-color: #f59e0b44;
      background: #f59e0b08;
    }
    .account-left { display: flex; align-items: center; gap: 12px; }
    .account-icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .account-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .account-txcount { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
    .account-balance { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }

    /* history rows */
    .tx-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeUp .3s ease both;
    }
    .tx-left { display: flex; align-items: center; gap: 10px; }
    .tx-icon {
      width: 34px; height: 34px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .tx-name { font-size: 12px; color: #aaa; }
    .tx-date { font-size: 10px; color: var(--muted); margin-top: 1px; letter-spacing: 1px; }
    .tx-amount { font-size: 15px; font-weight: 500; }

    /* month summary */
    .month-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .month-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      animation: fadeUp .4s ease both;
    }
    .month-card.gold { border-color: #f59e0b33; background: #f59e0b08; }
    .month-card-label { font-size: 9px; letter-spacing: 2px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
    .month-card-value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }

    /* import button */
    .import-wrap { margin-top: 8px; }
    .import-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1.5px dashed #333;
      background: transparent;
      color: #555;
      font-size: 12px;
      letter-spacing: 2px;
      font-family: inherit;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .2s;
    }
    .import-btn:hover { border-color: #555; color: #888; }
    .import-btn.loaded { border-color: var(--green); color: var(--green); border-style: solid; }

    /* section label */
    .section-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* date filter */
    .date-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      font-family: inherit;
      margin-bottom: 14px;
    }

    /* empty state */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 1px;
      line-height: 2;
    }
    .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: .5; }

    /* day summary bar */
    .day-bar {
      display: flex;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const ACCOUNTS = [
  { id: "paypay",   name: "📱 PayPay",   icon: "📱", display: "PayPay",   color: "#FF0033" },
  { id: "yucho",    name: "🏦 ゆうちょ",  icon: "🏦", display: "ゆうちょ",  color: "#4A90D9" },
  { id: "hokuriku", name: "🏛 北陸銀行", icon: "🏛",  display: "北陸銀行", color: "#2E6B4F" },
  { id: "cash",     name: "💴 Cash",     icon: "💴", display: "Cash",     color: "#B8860B" },
  { id: "savings",  name: "🪙 Savings",  icon: "🪙", display: "Savings",  color: "#f59e0b" },
];

let txs = [];
let view = "balance";
let filterDate = todayStr();
let imported = false;

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDate(s) {
  // parse as local date to avoid UTC offset shifting the day
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("ja-JP", { month: "short", day: "numeric", weekday: "short" });
}

function loadLocal() {
  try { return JSON.parse(localStorage.getItem("okane_txs") || "[]"); } catch { return []; }
}

function saveLocal() {
  try { localStorage.setItem("okane_txs", JSON.stringify(txs)); } catch {}
}

// ── CSV Import ─────────────────────────────────────────
function importCSV() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".csv";
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const text = ev.target.result.replace(/^\uFEFF/, "");
      const lines = text.trim().split("\n").filter(l => l.trim());
      const parsed = [];
      lines.forEach((line, i) => {
        const parts = line.split(",");
        if (parts.length < 4) return;
        const [date, type, amount, account, toAccount] = parts.map(p => p.trim());
        if (!date || !type || isNaN(Number(amount)) || type === "Type") return;
        const accId  = ACCOUNTS.find(a => a.name.trim() === account.trim())?.id  || ACCOUNTS.find(a => a.id === account.trim())?.id || account.trim();
        const toAccId = toAccount ? ACCOUNTS.find(a => a.name.trim() === toAccount.trim())?.id || ACCOUNTS.find(a => a.id === toAccount.trim())?.id || toAccount.trim() : null;
        const id = Date.now() + i;
        if (type === "transfer") {
          parsed.push({ id: id+1, type: "transfer-out", amount: Number(amount), account: accId, toAccount: toAccId, date });
          parsed.push({ id: id+2, type: "transfer-in",  amount: Number(amount), account: toAccId, fromAccount: accId, date });
        } else {
          parsed.push({ id, type, amount: Number(amount), account: accId, date });
        }
      });

      // merge + deduplicate
      const merged = [...parsed];
      loadLocal().forEach(t => {
        const dup = parsed.find(p => p.date===t.date && p.type===t.type && p.amount===t.amount && p.account===t.account);
        if (!dup) merged.push(t);
      });
      merged.sort((a,b) => b.date.localeCompare(a.date));
      txs = merged;
      saveLocal();
      imported = true;
      render();
    };
    reader.readAsText(file, "UTF-8");
  };
  input.click();
}

// ── Balances ───────────────────────────────────────────
function getBalances() {
  const b = {};
  ACCOUNTS.forEach(a => {
    b[a.id] = txs.reduce((s, t) => {
      if (t.account !== a.id) return s;
      if (t.type === "income" || t.type === "transfer-in") return s + t.amount;
      if (t.type === "expense" || t.type === "transfer-out") return s - t.amount;
      return s;
    }, 0);
  });
  return b;
}

// ── Render ─────────────────────────────────────────────
function render() {
  const balances = getBalances();
  const netBalance = Object.values(balances).reduce((s,v) => s+v, 0);
  const todayTxs = txs.filter(t => t.date === todayStr());
  const todayOut = todayTxs.filter(t => t.type === "expense").reduce((s,t) => s+t.amount, 0);

  let html = ``;

  // ── Header ──
  html += `
  <div class="header">
    <div class="header-eyebrow">財務 · Finance</div>
    <div class="header-title">お金メモ</div>
    <div class="net-balance">
      <div class="net-label">NET BALANCE</div>
      <div class="net-value" style="color:${netBalance>=0?'#f0ede8':'#ef4444'}">¥${netBalance.toLocaleString()}</div>
    </div>
    <div class="mini-cards">
      <div class="mini-card">
        <div class="mini-card-label">Today Out</div>
        <div class="mini-card-value" style="color:#ef4444">¥${todayOut.toLocaleString()}</div>
      </div>
      <div class="mini-card" style="border-color:#f59e0b33;background:#f59e0b08">
        <div class="mini-card-label" style="color:#f59e0b99">🪙 Savings</div>
        <div class="mini-card-value" style="color:#f59e0b">¥${balances.savings.toLocaleString()}</div>
      </div>
    </div>
  </div>`;

  // ── Tabs ──
  const tabs = [["balance","残高"],["history","履歴"],["month","月次"]];
  html += `<div class="tabs">`;
  tabs.forEach(([v,label]) => {
    html += `<button class="tab ${view===v?"active":""}" onclick="setView('${v}')">${label}</button>`;
  });
  html += `</div>`;

  // ── Balance View ──
  if (view === "balance") {
    html += `<div class="section">`;

    if (txs.length === 0) {
      html += `<div class="empty">
        <div class="empty-icon">📂</div>
        No data yet<br/>Import your CSV to get started
      </div>`;
    } else {
      // savings first, highlighted
      const sav = ACCOUNTS.find(a => a.id === "savings");
      html += `
        <div class="account-card savings-card" style="animation-delay:.05s">
          <div class="account-left">
            <div class="account-icon" style="background:#f59e0b22">${sav.icon}</div>
            <div>
              <div class="account-name">${sav.display}</div>
              <div class="account-txcount">${txs.filter(t=>t.account==="savings").length} TXS</div>
            </div>
          </div>
          <div class="account-balance" style="color:#f59e0b">¥${balances.savings.toLocaleString()}</div>
        </div>`;

      // other accounts
      ACCOUNTS.filter(a => a.id !== "savings").forEach((a, i) => {
        const bal = balances[a.id];
        html += `
          <div class="account-card" style="animation-delay:${(i+1)*.06}s">
            <div class="account-left">
              <div class="account-icon" style="background:${a.color}22">${a.icon}</div>
              <div>
                <div class="account-name">${a.display}</div>
                <div class="account-txcount">${txs.filter(t=>t.account===a.id).length} TXS</div>
              </div>
            </div>
            <div class="account-balance" style="color:${bal>=0?"#f0ede8":"#ef4444"}">¥${bal.toLocaleString()}</div>
          </div>`;
      });
    }

    html += importBtnHTML();
    html += `</div>`;
  }

  // ── History View ──
  if (view === "history") {
    html += `<div class="section">`;
    html += `<input class="date-input" type="date" value="${filterDate}" onchange="setFilterDate(this.value)"/>`;

    const dayTxs = txs.filter(t => t.date === filterDate && t.type !== "transfer-in");
    if (dayTxs.length === 0) {
      html += `<div class="empty"><div class="empty-icon">🗓</div>No records for this day</div>`;
    } else {
      const dayOut = dayTxs.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
      const dayIn  = dayTxs.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
      html += `<div class="day-bar">
        <span style="color:#ef4444">-¥${dayOut.toLocaleString()}</span>
        <span style="color:#444">${formatDate(filterDate)}</span>
        <span style="color:#22c55e">+¥${dayIn.toLocaleString()}</span>
      </div>`;
      dayTxs.forEach((t, i) => {
        const acc = ACCOUNTS.find(a => a.id === t.account);
        const toAcc = t.toAccount ? ACCOUNTS.find(a => a.id === t.toAccount) : null;
        let label = acc?.display || t.account;
        let color = "#f0ede8"; let sign = "";
        if (t.type === "expense") { color = "#ef4444"; sign = "−"; }
        if (t.type === "income")  { color = "#22c55e"; sign = "+"; }
        if (t.type === "transfer-out") {
          label = `${acc?.display} → ${toAcc?.display}`;
          color = toAcc?.id === "savings" ? "#f59e0b" : "#a78bfa";
          sign = "→";
        }
        html += `
          <div class="tx-row" style="animation-delay:${i*.04}s">
            <div class="tx-left">
              <div class="tx-icon" style="background:${acc?.color}22">${acc?.icon}</div>
              <div>
                <div class="tx-name">${label}</div>
              </div>
            </div>
            <div class="tx-amount" style="color:${color}">${sign} ¥${t.amount.toLocaleString()}</div>
          </div>`;
      });
    }
    html += importBtnHTML();
    html += `</div>`;
  }

  // ── Month View ──
  if (view === "month") {
    html += `<div class="section">`;
    const now = new Date();
    const mTxs = txs.filter(t => {
      const [y,m] = t.date.split("-").map(Number);
      return m-1 === now.getMonth() && y === now.getFullYear();
    });
    const mSpend = mTxs.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
    const mEarn  = mTxs.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
    const mSaved = mTxs.filter(t=>t.type==="transfer-out"&&t.toAccount==="savings").reduce((s,t)=>s+t.amount,0);
    const mNet   = mEarn - mSpend;

    html += `<div class="section-label">${now.toLocaleDateString("ja-JP",{year:"numeric",month:"long"})}</div>`;
    html += `<div class="month-grid">
      <div class="month-card" style="animation-delay:.05s">
        <div class="month-card-label">Spent</div>
        <div class="month-card-value" style="color:#ef4444">¥${mSpend.toLocaleString()}</div>
      </div>
      <div class="month-card" style="animation-delay:.1s">
        <div class="month-card-label">Earned</div>
        <div class="month-card-value" style="color:#22c55e">¥${mEarn.toLocaleString()}</div>
      </div>
      <div class="month-card gold" style="animation-delay:.15s">
        <div class="month-card-label" style="color:#f59e0b88">Saved</div>
        <div class="month-card-value" style="color:#f59e0b">¥${mSaved.toLocaleString()}</div>
      </div>
      <div class="month-card" style="animation-delay:.2s;border-color:${mNet>=0?"#22c55e33":"#ef444433"};background:${mNet>=0?"#22c55e08":"#ef444408"}">
        <div class="month-card-label">Net</div>
        <div class="month-card-value" style="color:${mNet>=0?"#22c55e":"#ef4444"}">¥${mNet.toLocaleString()}</div>
      </div>
    </div>`;

    // per-account breakdown this month
    html += `<div class="section-label" style="margin-top:20px">By Account</div>`;
    ACCOUNTS.forEach((a,i) => {
      const spent = mTxs.filter(t=>t.account===a.id&&t.type==="expense").reduce((s,t)=>s+t.amount,0);
      if (spent === 0 && a.id !== "savings") return;
      const saved = mTxs.filter(t=>t.type==="transfer-out"&&t.toAccount===a.id).reduce((s,t)=>s+t.amount,0);
      const val = a.id==="savings" ? saved : spent;
      if (val === 0) return;
      html += `
        <div class="account-card ${a.id==="savings"?"savings-card":""}" style="animation-delay:${i*.05}s">
          <div class="account-left">
            <div class="account-icon" style="background:${a.color}22">${a.icon}</div>
            <div class="account-name">${a.display}</div>
          </div>
          <div style="font-size:16px;font-weight:500;color:${a.id==="savings"?"#f59e0b":"#ef4444"}">
            ${a.id==="savings"?"+":"-"}¥${val.toLocaleString()}
          </div>
        </div>`;
    });

    html += importBtnHTML();
    html += `</div>`;
  }

  document.getElementById("app").innerHTML = html;
}

function importBtnHTML() {
  return `<div class="import-wrap">
    <button class="import-btn ${imported?"loaded":""}" onclick="importCSV()">
      ${imported ? "✓ CSV Loaded — Import Again" : "⬆ Import CSV from iCloud"}
    </button>
  </div>`;
}

function setView(v)        { view = v; render(); }
function setFilterDate(v)  { filterDate = v; render(); }

// init
txs = loadLocal();
if (txs.length > 0) imported = true;
render();
</script>
</body>
</html>
